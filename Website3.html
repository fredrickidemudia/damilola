<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container{
            width: 100%;
            max-width: 1140px;
            padding: 0;
            margin: 0 auto;
            background-color:white;
            min-height: 100dvh;
            border: 2px solid #8D1CEB
        }

        header{
            font-size: 1.5rem;
            text-align: center;
            background-color: #8D1CEB;
            min-height: 30vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: whitesmoke;

        }

        main{
            font-size: 1.3rem;
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .div1{
            width: 20%;
            margin: 15px;
            min-height: 35vh;
            background-color: white;
            display: flex;
            justify-content: center;
            border: 1px solid gray;
            
        }

        .div2{
            width: 20%;
            margin: 15px;
            min-height: 20vh;
            background-color:white;
            display: flex;
            justify-content: center;
            border: 1px solid gray;

        }

        .div3{
            width: 20%;
            margin: 15px;
            min-height:20vh;
            background-color: white;
            display: flex;
            justify-content: center;
            border: 1px solid gray;

        }

        img{
            width: 100%;
            height: 100%;
        }

        .heading-text{
            text-align: center;
            font-size: 40px;
            color: #8D1CEB;
        }
    </style>
<body>

    <div class="container">

        <header>
            <h1>Dami's Fashion  Store</h1>
        </header>
            <h1 class="heading-text">Bags and Accessories</h1>
        <main>
            <div class="div1">
                <img src="./images/braceless.jpg"  alt="braceless">
            </div>
            <div class="div2">
                <img src="./images/bag.jpg"  alt="bag">
            </div>
            
            <div class="div3">
                <img src="./images/shoes.jpg"  alt="braceless">
            </div>
        </main>

    </div>
    
</body>
</html>
